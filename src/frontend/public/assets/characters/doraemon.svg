<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <defs>
    <radialGradient id="doraBlue" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </radialGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="60" cy="115" rx="38" ry="35" fill="#1565C0"/>
  <!-- Head -->
  <circle cx="60" cy="55" r="40" fill="url(#doraBlue)"/>
  <!-- White face -->
  <ellipse cx="60" cy="62" rx="28" ry="26" fill="white"/>
  <!-- Eyes -->
  <ellipse cx="47" cy="52" rx="6" ry="7" fill="#222"/>
  <ellipse cx="73" cy="52" rx="6" ry="7" fill="#222"/>
  <ellipse cx="49" cy="50" rx="2" ry="2.5" fill="white"/>
  <ellipse cx="75" cy="50" rx="2" ry="2.5" fill="white"/>
  <!-- Nose -->
  <circle cx="60" cy="58" r="5" fill="#E53935"/>
  <!-- Mouth -->
  <path d="M52 67 Q60 74 68 67" stroke="#333" stroke-width="1.5" fill="none"/>
  <!-- Whiskers left -->
  <line x1="15" y1="52" x2="42" y2="55" stroke="#333" stroke-width="0.8"/>
  <line x1="15" y1="58" x2="42" y2="58" stroke="#333" stroke-width="0.8"/>
  <line x1="15" y1="64" x2="42" y2="61" stroke="#333" stroke-width="0.8"/>
  <!-- Whiskers right -->
  <line x1="105" y1="52" x2="78" y2="55" stroke="#333" stroke-width="0.8"/>
  <line x1="105" y1="58" x2="78" y2="58" stroke="#333" stroke-width="0.8"/>
  <line x1="105" y1="64" x2="78" y2="61" stroke="#333" stroke-width="0.8"/>
  <!-- Bell on neck -->
  <circle cx="60" cy="88" r="8" fill="#FFD54F" stroke="#F9A825" stroke-width="1.5"/>
  <circle cx="60" cy="88" r="3" fill="#F9A825"/>
  <!-- Arms -->
  <ellipse cx="22" cy="100" rx="8" ry="16" fill="#1565C0" transform="rotate(-20 22 100)"/>
  <ellipse cx="98" cy="100" rx="8" ry="16" fill="#1565C0" transform="rotate(20 98 100)"/>
  <!-- Feet -->
  <ellipse cx="45" cy="148" rx="15" ry="8" fill="white" stroke="#ddd" stroke-width="0.5"/>
  <ellipse cx="75" cy="148" rx="15" ry="8" fill="white" stroke="#ddd" stroke-width="0.5"/>
  <!-- Pocket -->
  <ellipse cx="60" cy="108" rx="18" ry="8" fill="#0D47A1" opacity="0.5"/>
</svg>
